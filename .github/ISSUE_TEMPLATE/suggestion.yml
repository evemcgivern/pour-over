name: Suggestion
description: An idea or enhancement for Live Brew
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues on GitHub are public. Please leave out personal details.
  - type: textarea
    id: brewing
    attributes:
      label: What are you trying to brew or do?
    validations:
      required: true
  - type: textarea
    id: help
    attributes:
      label: What would help?
    validations:
      required: true
